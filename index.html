<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOS AI Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#17243a}
header{background:#123b55;color:white;padding:22px}
header h2{margin:0}
header p{margin:7px 0 0;color:#c8dce8}
main{padding:18px;max-width:750px;margin:auto}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px #0000000c}
h3{margin-top:0;color:#164b64}
input,button{width:100%;padding:13px;border-radius:9px;font-size:15px;margin-top:9px}
input{border:1px solid #ccd5df}
button{border:0;background:#087f80;color:white;font-weight:bold}
button:active{opacity:.8}
.doc{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}
.status{color:#b7791f;font-size:12px}
#result{white-space:pre-wrap;line-height:1.6}
footer{text-align:center;color:#778;padding:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h2>LOS AI Assistant</h2>
<p>Document Verification Workspace</p>
</header>
<main>
<div class="card">
<h3>New Verification Case</h3>
<label>Lead Number</label>
<input id="lead" placeholder="Enter Lead Number">
<button onclick="startCase()">Start Verification</button>
<p id="caseStatus"></p>
</div>

<div class="card">
<h3>Select Documents</h3>
<div id="documents">
</div>
<button onclick="selectDocuments()">Save Selected Documents</button>
</div>

<div class="card">
<h3>Verification Progress</h3>
<p id="progress">No case started</p>
<div id="result">Your verification report will appear here.</div>
</div>
</main>
<footer>LOS AI Assistant · Human-controlled verification</footer>

<script>
const names=["Aadhaar Card","PAN Card","Additional Documents","Application Form – Online"];
let selected=[];
let lead="";

document.getElementById("documents").innerHTML=names.map((n,i)=>`
<div class="doc">
<label><input type="checkbox" id="d${i}" style="width:auto"> ${n}</label>
<span class="status">Pending</span>
</div>`).join("");

function startCase(){
lead=document.getElementById("lead").value.trim();
if(!lead){alert("Enter Lead Number");return;}
document.getElementById("caseStatus").textContent="Case started: "+lead;
document.getElementById("progress").textContent="Case ready for document selection.";
}

function selectDocuments(){
if(!lead){alert("Start a case first");return;}
selected=names.filter((n,i)=>document.getElementById("d"+i).checked);
if(!selected.length){alert("Select at least one document");return;}
document.getElementById("progress").textContent=
"Lead: "+lead+"\nSelected: "+selected.join(", ");
document.getElementById("result").textContent=
"Documents selected successfully.\nOCR and verification engine will be integrated in the next development stage.";
}
</script>
</body>
</html>
